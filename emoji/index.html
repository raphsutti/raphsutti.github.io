<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emoji Word Guessing Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <header>
      <h1>Emoji Word Guess</h1>
      
      <div class="mode-toggle-container">
        <label class="switch">
          <input type="checkbox" id="genz-toggle">
          <span class="slider round"></span>
        </label>
        <span class="toggle-label" id="toggle-label">Gen Z Mode: OFF</span>
      </div>

      <div class="filter-container" id="filter-container">
        <label for="difficulty-select">Difficulty:</label>
        <select id="difficulty-select">
          <option value="All">All</option>
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
        </select>
      </div>
    </header>

    <main class="card" id="game-card">
      <div class="difficulty-badge" id="difficulty-badge">Easy</div>
      
      <div class="emoji-display" id="emoji-display">✏️</div>

      <div class="meaning-display" id="meaning-display"></div>

      <div class="word-display" id="word-display"></div>

      <div class="controls" id="controls">
        <button id="reveal-first-btn" class="btn btn-primary">Reveal First Letter</button>
        <button id="reveal-random-btn" class="btn btn-secondary">Reveal Another Letter</button>
        <button id="reveal-answer-btn" class="btn btn-primary">Reveal Answer</button>
        <button id="next-btn" class="btn btn-action">Next Word</button>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
